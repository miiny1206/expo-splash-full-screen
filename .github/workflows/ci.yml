name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test (with coverage)
        run: bun test --coverage

      - name: Build
        run: bun run build

      - name: Pack dry run
        run: bun pm pack --dry-run

  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle', 'example/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Bootstrap example (build, pack, prebuild android)
        env:
          EXPO_PLATFORM: android
        run: bun run example:bootstrap

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-pixel6

      - name: Pre-create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: echo "AVD warmed"

      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            cd example/android
            ./gradlew :app:assembleDebug -x lint
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
            adb install -r "$APK"
            cd ../..
            maestro test .maestro --format junit --output maestro-android.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: maestro-android.xml
          if-no-files-found: ignore

  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Bootstrap example (build, pack, prebuild ios)
        env:
          EXPO_PLATFORM: ios
        run: bun run example:bootstrap

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        id: sim
        run: |
          set -e
          # Pick the newest available iPhone 16-class simulator on the runner.
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16( |\\()" | head -n1 | grep -oE "[A-F0-9-]{36}")
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( |\\()" | head -n1 | grep -oE "[A-F0-9-]{36}")
          fi
          echo "Using simulator UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & install example app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -eo pipefail
          cd example/ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tail -200
          APP=$(find build/Build/Products -name "*.app" -type d | head -n1)
          echo "Installing $APP"
          xcrun simctl install "$UDID" "$APP"

      - name: Run Maestro
        run: maestro test .maestro --format junit --output maestro-ios.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: maestro-ios.xml
          if-no-files-found: ignore
