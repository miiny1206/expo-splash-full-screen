# Simulate process death (force-stop) and verify splash replays on relaunch (cold-start path re-runs).
appId: com.example.splashfullscreen
name: process-death
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'expo-splash-full-screen'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'log-didHide'
    timeout: 10000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'expo-splash-full-screen'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'log-didShow'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'log-didHide'
    timeout: 10000
