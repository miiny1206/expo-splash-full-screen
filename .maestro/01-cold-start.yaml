# Cold start: splash overlay → auto-hide via app's hide() call → app UI visible + events logged.
appId: com.example.splashfullscreen
name: cold-start
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'expo-splash-full-screen'
    timeout: 30000
- assertVisible: 'Event log'
- extendedWaitUntil:
    visible:
      id: 'log-didShow'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'log-didHide'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'log-listeners attached'
    timeout: 10000
